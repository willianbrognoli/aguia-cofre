<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar · Cofre de Questões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root { --preto: #111111; --campo: #1f1f1f; --bronze: #cca977; --bronze-2: #997650; --bege: #e8d4b8; --creme: #f5f2ed; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--creme);
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(204,169,119,.16), transparent 70%),
    linear-gradient(160deg, #05070b 0%, #0c1017 55%, #05070b 100%);
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(204,169,119,.07) 1px, transparent 1px); background-size: 28px 28px;
}
.cartao {
  position: relative; width: 100%; max-width: 420px; padding: 36px 32px 30px;
  background: rgba(17,17,17,.92); border: 1px solid rgba(204,169,119,.35); border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0,0,0,.55);
}
.logo { display: block; width: 190px; height: auto; margin: 0 auto 22px; }
h1 { margin: 0; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; color: var(--bronze); letter-spacing: .01em; }
.sub { margin: 6px 0 26px; text-align: center; color: rgba(245,242,237,.65); font-size: 15px; }
label { display: block; margin: 0 0 6px; font-size: 15px; color: rgba(245,242,237,.85); }
.campo { margin-bottom: 16px; }
input {
  width: 100%; padding: 12px 18px; border-radius: 999px; font: inherit; font-size: 16px;
  color: var(--creme); background: var(--campo); border: 1px solid rgba(255,255,255,.12);
}
input:focus { outline: none; border-color: var(--bronze); box-shadow: 0 0 0 3px rgba(204,169,119,.25); }
.senha { position: relative; }
.senha input { padding-right: 76px; }
.ver { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 6px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--bronze); font: inherit; font-size: 14px; cursor: pointer; }
.ver:hover { background: rgba(204,169,119,.12); }
.ver:focus-visible, button[type=submit]:focus-visible { outline: 2px solid var(--bege); outline-offset: 2px; }
button[type=submit] {
  width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 999px; cursor: pointer;
  font: inherit; font-weight: 700; font-size: 16px; color: #111; background: var(--bronze);
}
button[type=submit]:hover { background: #d9bb8e; }
button[type=submit][disabled] { opacity: .6; cursor: wait; }
.erro { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: rgba(179,65,47,.15); border: 1px solid rgba(179,65,47,.45); color: #f1c3ba; font-size: 14px; }
.rodape { margin: 22px 0 0; text-align: center; font-size: 13px; color: rgba(245,242,237,.45); }
</style>
</head>
<body>
<main class="cartao">
  <img class="logo" src="/static/logo.png" alt="Águia Carreiras Policiais">
  <h1>Cofre de Questões</h1>
  <p class="sub">Entre com seu usuário e senha.</p>
  <!--ERRO-->
  <form method="post" action="/login" id="form">
    <input type="hidden" name="proximo" value="<!--PROXIMO-->">
    <div class="campo">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required value="<!--USUARIO-->" autofocus>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <div class="senha">
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button type="button" class="ver" id="ver" aria-controls="senha" aria-pressed="false">Mostrar</button>
      </div>
    </div>
    <button type="submit" id="entrar">Entrar</button>
  </form>
  <p class="rodape">Acesso restrito à equipe Águia. Problemas para entrar? Fale com o administrador.</p>
</main>
<script>
const s = document.getElementById('senha'), v = document.getElementById('ver');
v.addEventListener('click', () => {
  const mostrar = s.type === 'password';
  s.type = mostrar ? 'text' : 'password';
  v.textContent = mostrar ? 'Ocultar' : 'Mostrar';
  v.setAttribute('aria-pressed', String(mostrar));
  s.focus();
});
document.getElementById('form').addEventListener('submit', () => {
  const b = document.getElementById('entrar'); b.disabled = true; b.textContent = 'Entrando…';
});
if (document.getElementById('usuario').value) s.focus();
</script>
</body>
</html>
