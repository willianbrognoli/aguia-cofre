<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cofre de Questões · Águia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root {
  --tinta: #111111;
  --tinta-2: #1f1f1f;
  --papel: #f5f2ed;
  --branco: #ffffff;
  --ouro: #cca977;
  --ouro-escuro: #997650;
  --ouro-claro: #f3e9d9;
  --linha: #e4ddd1;
  --texto: #1a1a1a;
  --suave: #6d665c;
  --ok: #2f7d4f;
  --ok-claro: #e5f2ea;
  --alerta: #a86a12;
  --alerta-claro: #fbf0dd;
  --erro: #b3412f;
  --erro-claro: #f9e7e3;
  --titulo: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --corpo: 'Nunito Sans', system-ui, sans-serif;
  --raio: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--corpo); font-size: 15px; line-height: 1.5; color: var(--texto); background: var(--papel); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--titulo); font-weight: 600; line-height: 1.1; margin: 0; letter-spacing: .01em; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
.num { font-family: var(--titulo); font-variant-numeric: tabular-nums; }

/* estrutura */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--tinta) 232px, var(--papel) 232px); }
#conteudo:focus { outline: none; }
.lateral { border-right: 1px solid rgba(204,169,119,.25); background: var(--tinta); color: #d7deea; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.marca { padding: 22px 22px 26px; border-bottom: 1px solid rgba(255,255,255,.08); }
.marca img { display: block; width: 150px; height: auto; margin-bottom: 14px; }
.marca strong { display: block; font-family: var(--titulo); font-size: 22px; font-weight: 600; color: var(--ouro); line-height: 1; }
.marca span { font-size: 13px; color: #97a3b8; }

.menu { list-style: none; margin: 14px 0 0; padding: 0 10px; }
.menu a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: var(--raio); color: #c9d2e1; text-decoration: none; font-weight: 500; }
.menu a:hover { background: var(--tinta-2); color: #fff; }
.menu a[aria-current="page"] { background: var(--tinta-2); color: #fff; box-shadow: inset 3px 0 0 var(--ouro); }
.contador { min-width: 26px; padding: 1px 7px; border-radius: 20px; background: var(--ouro); color: var(--tinta); font-family: var(--titulo); font-weight: 700; font-size: 14px; text-align: center; }
.lateral__pe { margin-top: auto; padding: 16px 22px; border-top: 1px solid rgba(255,255,255,.08); font-size: 13px; color: #97a3b8; }
.lateral__pe b { color: #fff; font-weight: 600; }

.principal { min-width: 0; }
.aviso { background: #1a1a1a; color: #e8d4b8; border-bottom: 1px solid rgba(204,169,119,.35); padding: 8px 32px; font-size: 14px; }
.conteudo { padding: 30px 32px 60px; max-width: 1180px; }
.cabeca { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.cabeca p { margin: 6px 0 0; color: var(--suave); max-width: 62ch; }

.painel { background: var(--branco); border: 1px solid var(--linha); border-radius: var(--raio); }
.painel + .painel { margin-top: 20px; }
.painel__cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--linha); }

/* botões */
.btn { border-radius: 999px !important; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: var(--raio); border: 1px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn--pri { background: var(--ouro); color: var(--tinta); }
.btn--pri:hover { background: #d9bb8e; }
.btn--sec { background: var(--branco); border-color: var(--linha); color: var(--texto); }
.btn--sec:hover { border-color: #b9c1ce; }
.btn--leve { background: transparent; color: var(--suave); padding: 6px 10px; }
.btn--leve:hover { color: var(--texto); background: #eef1f5; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn--p { padding: 5px 11px; font-size: 14px; }

/* painel: faixa de totais */
.faixa { border: 1px solid rgba(204,169,119,.35); display: grid; grid-template-columns: repeat(4, 1fr); background: var(--tinta); color: #fff; border-radius: var(--raio); overflow: hidden; margin-bottom: 20px; }
.faixa div { padding: 16px 20px; border-right: 1px solid rgba(255,255,255,.09); }
.faixa div:last-child { border-right: 0; }
.faixa .num { display: block; font-size: 38px; font-weight: 600; line-height: 1; }
.faixa small { color: #a9b4c7; font-size: 13px; }
.faixa .destaque .num { color: var(--ouro); }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 13px; color: var(--suave); padding: 10px 18px; border-bottom: 1px solid var(--linha); background: #faf8f4; }
td { padding: 12px 18px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.tabela-rolagem { overflow-x: auto; }
.barra { position: relative; height: 6px; background: #e9edf2; border-radius: 3px; overflow: hidden; min-width: 120px; }
.barra i { position: absolute; inset: 0 auto 0 0; background: var(--ouro-escuro); border-radius: 3px; }
.barra-leg { font-size: 13px; color: var(--suave); margin-top: 4px; }
.selo { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.selo--ok { background: var(--ok-claro); color: var(--ok); }
.selo--alerta { background: var(--alerta-claro); color: var(--alerta); }
.selo--erro { background: var(--erro-claro); color: var(--erro); }
.selo--neutro { background: #eceff4; color: var(--suave); }
.acoes { display: flex; gap: 6px; justify-content: flex-end; }

.envios { list-style: none; margin: 0; padding: 0; }
.envios li { display: grid; grid-template-columns: 110px 1fr auto; gap: 14px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--linha); }
.envios li:last-child { border-bottom: 0; }
.envios .tipo { font-size: 13px; color: var(--suave); }
.envios .msg { display: block; font-size: 13px; color: var(--erro); }
.envios .meta { font-size: 13px; color: var(--suave); text-align: right; }

/* enviar */
.form { padding: 22px; display: grid; gap: 20px; max-width: 640px; }
.campo label, .campo > span { display: block; font-weight: 600; margin-bottom: 6px; }
.campo small { display: block; color: var(--suave); margin-top: 5px; }
.campo select, .campo input[type=text] { width: 100%; padding: 9px 11px; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--branco); }
.segmentos { display: inline-flex; border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; flex-wrap: wrap; }
.segmentos button { padding: 8px 16px; border: 0; background: var(--branco); cursor: pointer; border-right: 1px solid var(--linha); }
.segmentos button:last-child { border-right: 0; }
.segmentos button[aria-pressed="true"] { background: var(--tinta); color: #fff; }
.segmentos button[disabled] { color: #a3abb8; cursor: not-allowed; }
.campo .soltar { position: relative; display: grid; font-weight: 400; margin: 0; place-items: center; text-align: center; gap: 4px; padding: 30px 20px; border: 2px dashed #c6cdd8; border-radius: var(--raio); background: #faf8f4; cursor: pointer; }
.campo .soltar.ativo { border-color: var(--ouro); background: var(--ouro-claro); }
.soltar b { font-size: 16px; }
.soltar span { color: var(--suave); font-size: 14px; }
.soltar input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.resultado { padding: 14px 16px; border-radius: var(--raio); background: var(--ok-claro); color: #1f5a37; }

/* revisar */
.revisao { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
.questao { padding: 22px 24px; }
.questao__meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--suave); font-size: 14px; margin-bottom: 14px; }
.questao__meta b { color: var(--texto); font-weight: 600; }
.questao__enun { font-size: 17px; line-height: 1.6; margin: 0 0 14px; max-width: 70ch; }
.alts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.alts li { display: flex; gap: 10px; }
.alts li b { flex-shrink: 0; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid #b9c1ce; border-radius: 50%; font-size: 13px; }
.alts li.gab b { background: var(--ok); border-color: var(--ok); color: #fff; }
.gabarito { margin-top: 14px; font-size: 14px; color: var(--suave); }
.aviso-img { margin-top: 12px; padding: 8px 12px; border-radius: var(--raio); background: var(--alerta-claro); color: #6b4608; font-size: 14px; }
.decisao { padding: 18px; position: sticky; top: 16px; }
.decisao h2 { margin-bottom: 4px; }
.decisao > p { margin: 0 0 14px; color: var(--suave); font-size: 14px; }
.opcoes { display: grid; gap: 8px; margin-bottom: 14px; }
.opcao { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--branco); cursor: pointer; }
.opcao:hover { border-color: #b9c1ce; }
.opcao[aria-pressed="true"] { border-color: var(--ouro); background: var(--ouro-claro); }
.opcao kbd { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; background: #eceff4; font-family: var(--titulo); font-size: 14px; }
.opcao[aria-pressed="true"] kbd { background: var(--ouro); color: var(--tinta); }
.opcao strong { display: block; font-weight: 600; line-height: 1.3; }
.opcao small { color: var(--suave); }
.confianca { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.confianca .barra { min-width: 0; flex: 1; height: 4px; }
.confianca .barra i { background: var(--ouro); }
.outro select { width: 100%; padding: 8px 10px; border: 1px solid var(--linha); border-radius: var(--raio); }
.decisao__acoes { display: flex; gap: 8px; margin-top: 16px; }
.decisao__acoes .btn--pri { flex: 1; }
.atalhos { margin-top: 12px; font-size: 13px; color: var(--suave); }
.progresso { font-size: 14px; color: var(--suave); }
.progresso .num { font-size: 20px; color: var(--texto); }

/* filtrar */
.filtro { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.arvore { padding: 6px 0; max-height: 620px; overflow: auto; }
.aula { border-bottom: 1px solid var(--linha); }
.aula:last-child { border-bottom: 0; }
.aula > label { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.aula ul { list-style: none; margin: 0; padding: 0 0 8px; }
.aula li label { display: grid; grid-template-columns: 18px 44px 1fr auto; gap: 8px; align-items: center; padding: 5px 18px 5px 30px; cursor: pointer; }
.aula li label:hover, .aula > label:hover { background: #f7f8fa; }
.aula li .cod { color: var(--suave); font-size: 14px; }
.aula li .qtd { color: var(--suave); font-size: 14px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--tinta); margin: 0; }
.filtros-extra { padding: 16px 18px; display: grid; gap: 14px; border-bottom: 1px solid var(--linha); }
.fichas { display: flex; flex-wrap: wrap; gap: 6px; }
.ficha { padding: 4px 11px; border: 1px solid var(--linha); border-radius: 20px; background: var(--branco); cursor: pointer; font-size: 14px; }
.ficha[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: #fff; }
.anos { display: flex; align-items: center; gap: 8px; }
.anos input { width: 90px; padding: 6px 8px; border: 1px solid var(--linha); border-radius: var(--raio); }
.saida { padding: 18px; }
.saida__total { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.saida__total .num { font-size: 56px; font-weight: 700; line-height: .9; }
.saida__total span { color: var(--suave); }
.codigos { font-family: var(--titulo); font-size: 17px; letter-spacing: .02em; line-height: 1.7; background: var(--tinta); color: #e8edf5; border-radius: var(--raio); padding: 12px 14px; max-height: 190px; overflow: auto; word-break: break-word; }
.codigos:empty::before { content: 'Marque tópicos à esquerda para ver os códigos.'; font-family: var(--corpo); font-size: 14px; color: #97a3b8; }
.saida__acoes { display: grid; gap: 8px; margin-top: 14px; }
.saida__acoes .linha { display: flex; gap: 8px; flex-wrap: wrap; }
.saida small { color: var(--suave); }

.vazio { padding: 40px 20px; text-align: center; color: var(--suave); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); opacity: 0; background: var(--tinta); color: #fff; padding: 10px 18px; border-radius: var(--raio); box-shadow: 0 6px 24px rgba(0,0,0,.25); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
.toast.visivel { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 980px) {
  .revisao, .filtro { grid-template-columns: 1fr; }
  .decisao { position: static; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; background: var(--papel); }
  .lateral { position: static; height: auto; }
  .marca { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca img { width: 110px; margin: 0; }
  .marca strong { font-size: 18px; text-align: right; }
  .principal, .lateral { min-width: 0; }
  .app > * { min-width: 0; }
  .menu { display: flex; overflow-x: auto; padding: 0 8px 8px; margin: 0; }
  .menu a { white-space: nowrap; }
  .lateral__pe { display: none; }
  .conteudo { padding: 20px 16px 40px; }
  .aviso { padding: 8px 16px; }
  .faixa { grid-template-columns: 1fr 1fr; }
  .faixa div:nth-child(2) { border-right: 0; }
  .faixa div:nth-child(-n+2) { border-bottom: 1px solid rgba(255,255,255,.09); }
  .envios li { grid-template-columns: 1fr; gap: 2px; }
  .envios .meta { text-align: left; }
  h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca"><img src="/static/logo.png" alt="Águia Carreiras Policiais"><strong>Cofre de Questões</strong></div>
    <nav aria-label="Seções">
      <ul class="menu">
        <li><a href="#painel" data-rota="painel">Painel</a></li>
        <li><a href="#enviar" data-rota="enviar">Enviar arquivo</a></li>
        <li><a href="#revisar" data-rota="revisar">Revisar <span class="contador" id="menu-revisar">–</span></a></li>
        <li><a href="#filtrar" data-rota="filtrar">Montar caderno</a></li>
      </ul>
    </nav>
    <div class="lateral__pe">Conectado como <b id="usuario">…</b></div>
  </aside>

  <div class="principal">
    <div class="aviso" id="aviso-exemplo" hidden>Você está vendo dados de exemplo. Os números reais aparecem quando o primeiro caderno do Tec for processado.</div>
    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Number(n || 0).toLocaleString('pt-BR');
const quando = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  if (min < 60) return `há ${min} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  return d.toLocaleDateString('pt-BR');
};

async function api(caminho, corpo) {
  const r = await fetch('/api' + caminho, corpo === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo)
  });
  if (!r.ok) throw new Error(`Erro ${r.status} em ${caminho}`);
  const j = await r.json();
  if (j.exemplo) $('#aviso-exemplo').hidden = false;
  return j;
}

let timerToast;
function avisar(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('visivel');
  clearTimeout(timerToast);
  timerToast = setTimeout(() => t.classList.remove('visivel'), 2600);
}

const SITUACAO = {
  pronta: ['selo--ok', 'Pronta'],
  pendencias: ['selo--alerta', 'Com revisões pendentes'],
  processando: ['selo--neutro', 'Processando'],
  sem_caderno: ['selo--neutro', 'Aguardando caderno'],
};
const STATUS_ENVIO = {
  pronto: ['selo--ok', 'Processado'],
  processando: ['selo--neutro', 'Processando'],
  recebido: ['selo--neutro', 'Na fila'],
  erro: ['selo--erro', 'Erro'],
};
const TIPO_ENVIO = { caderno: 'Caderno do Tec', matriz: 'Matriz', edital: 'Edital' };

let resumoCache = null;
async function carregarResumo() {
  resumoCache = await api('/resumo');
  $('#menu-revisar').textContent = fmt(resumoCache.totais.revisar);
  return resumoCache;
}

/* ───────── Painel ───────── */
async function telaPainel(el) {
  const r = resumoCache || await carregarResumo();
  const t = r.totais;
  el.innerHTML = `
    <div class="cabeca"><div><h1>Painel</h1><p>Situação de cada matéria e dos últimos arquivos enviados.</p></div>
      <a class="btn btn--pri" href="#enviar">Enviar caderno</a></div>
    <div class="faixa">
      <div><span class="num">${fmt(t.questoes)}</span><small>questões no cofre</small></div>
      <div><span class="num">${fmt(t.classificadas)}</span><small>classificadas por tópico</small></div>
      <div class="destaque"><span class="num">${fmt(t.revisar)}</span><small>aguardando sua revisão</small></div>
      <div><span class="num">${fmt(t.comentadas)}</span><small>com comentário pronto</small></div>
    </div>
    <section class="painel">
      <div class="painel__cab"><h2>Matérias</h2></div>
      <div class="tabela-rolagem"><table>
        <thead><tr><th>Matéria</th><th>Questões</th><th>Classificação</th><th>Situação</th><th></th></tr></thead>
        <tbody>${r.materias.map(m => {
          const pct = m.questoes ? Math.round(m.classificadas / m.questoes * 100) : 0;
          const [cls, txt] = SITUACAO[m.situacao] || SITUACAO.sem_caderno;
          return `<tr>
            <td><b>${esc(m.nome)}</b><div class="barra-leg">${m.atualizado ? 'Atualizada ' + quando(m.atualizado) : 'Sem dados ainda'}</div></td>
            <td class="num" style="font-size:20px">${fmt(m.questoes)}</td>
            <td>${m.questoes ? `<div class="barra"><i style="width:${pct}%"></i></div><div class="barra-leg">${pct}% · ${fmt(m.revisar)} para revisar</div>` : '<span class="barra-leg">—</span>'}</td>
            <td><span class="selo ${cls}">${txt}</span></td>
            <td><div class="acoes">${m.questoes
              ? `${m.revisar ? `<a class="btn btn--sec btn--p" href="#revisar">Revisar</a>` : ''}<a class="btn btn--sec btn--p" href="#filtrar">Montar caderno</a>`
              : `<a class="btn btn--sec btn--p" href="#enviar?materia=${m.id}">Enviar caderno</a>`}</div></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </section>
    <section class="painel">
      <div class="painel__cab"><h2>Últimos envios</h2></div>
      <ul class="envios">${r.envios.map(e => {
        const [cls, txt] = STATUS_ENVIO[e.status] || STATUS_ENVIO.recebido;
        return `<li>
          <span class="tipo">${TIPO_ENVIO[e.tipo] || e.tipo}</span>
          <span><b>${esc(e.arquivo)}</b> <span class="selo ${cls}">${txt}</span>
            ${e.status === 'pronto' ? `<span class="barra-leg" style="display:block">${esc(e.materia)} · ${fmt(e.total)} itens, ${fmt(e.novas)} novos</span>` : ''}
            ${e.mensagem ? `<span class="msg">${esc(e.mensagem)}</span>` : ''}</span>
          <span class="meta">${esc(e.por)}, ${quando(e.quando)}</span>
        </li>`;
      }).join('')}</ul>
    </section>`;
}

/* ───────── Enviar ───────── */
async function telaEnviar(el, params) {
  const r = resumoCache || await carregarResumo();
  let tipo = 'caderno';
  const materiaInicial = params.get('materia') || '';
  el.innerHTML = `
    <div class="cabeca"><div><h1>Enviar arquivo</h1><p>Envie o PDF do caderno completo gerado no Tec ou a planilha com os tópicos da matéria.</p></div></div>
    <section class="painel">
      <form class="form" id="form-envio" novalidate>
        <div class="campo"><span>O que você está enviando?</span>
          <div class="segmentos" role="group" aria-label="Tipo de arquivo">
            <button type="button" data-tipo="caderno" aria-pressed="true">Caderno do Tec (PDF)</button>
            <button type="button" data-tipo="matriz" aria-pressed="false">Matriz de tópicos (Excel)</button>
            <button type="button" data-tipo="edital" aria-pressed="false" disabled title="Disponível na fase 2">Edital verticalizado</button>
          </div>
        </div>
        <div class="campo"><label for="materia">Matéria</label>
          <select id="materia" required>
            <option value="">Escolha a matéria</option>
            ${r.materias.map(m => `<option value="${m.id}" ${String(m.id) === materiaInicial ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="campo">
          <label class="soltar" id="soltar" for="arquivo">
            <b id="soltar-titulo">Arraste o PDF aqui ou clique para escolher</b>
            <span id="soltar-info">Caderno completo da matéria, do jeito que o Tec gera</span>
            <input type="file" id="arquivo" accept=".pdf">
          </label>
        </div>
        <div class="campo" id="campo-caderno"><label for="ref">Número do caderno no Tec <span style="font-weight:400;color:var(--suave)">(opcional)</span></label>
          <input type="text" id="ref" inputmode="numeric" placeholder="Ex.: 123456">
          <small>Só para referência. Os códigos das questões são lidos do próprio PDF.</small>
        </div>
        <div><button class="btn btn--pri" type="submit">Enviar arquivo</button></div>
        <div id="envio-resultado"></div>
      </form>
    </section>`;

  const input = $('#arquivo'), soltar = $('#soltar');
  const atualizarTipo = () => {
    $$('.segmentos button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tipo === tipo)));
    const pdf = tipo === 'caderno';
    input.accept = pdf ? '.pdf' : '.xlsx,.xls,.csv';
    $('#soltar-titulo').textContent = pdf ? 'Arraste o PDF aqui ou clique para escolher' : 'Arraste a planilha aqui ou clique para escolher';
    $('#soltar-info').textContent = pdf ? 'Caderno completo da matéria, do jeito que o Tec gera' : 'Uma linha por tópico: código, aula e título';
    $('#campo-caderno').hidden = !pdf;
    input.value = '';
  };
  $$('.segmentos button').forEach(b => b.addEventListener('click', () => { tipo = b.dataset.tipo; atualizarTipo(); }));
  input.addEventListener('change', () => {
    const f = input.files[0];
    if (f) { $('#soltar-titulo').textContent = f.name; $('#soltar-info').textContent = `${(f.size / 1048576).toFixed(1)} MB · clique para trocar`; }
  });
  ['dragenter', 'dragover'].forEach(ev => soltar.addEventListener(ev, e => { e.preventDefault(); soltar.classList.add('ativo'); }));
  ['dragleave', 'drop'].forEach(ev => soltar.addEventListener(ev, e => { e.preventDefault(); soltar.classList.remove('ativo'); }));
  soltar.addEventListener('drop', e => { if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); } });

  $('#form-envio').addEventListener('submit', async (e) => {
    e.preventDefault();
    const materia = $('#materia').value, f = input.files[0], saida = $('#envio-resultado');
    if (!materia) { avisar('Escolha a matéria antes de enviar.'); $('#materia').focus(); return; }
    if (!f) { avisar('Escolha o arquivo antes de enviar.'); return; }
    await api('/envios/simular', { tipo, materia_id: Number(materia), arquivo: f.name, ref_externa: $('#ref').value || null });
    saida.innerHTML = `<div class="resultado"><b>${esc(f.name)} recebido.</b> Nesta versão de demonstração o arquivo não é processado. A leitura real entra assim que o leitor de PDF estiver pronto.</div>`;
    avisar('Arquivo enviado');
  });
}

/* ───────── Revisar ───────── */
let todosTopicos = null;
async function listaTopicos() {
  if (!todosTopicos) {
    const t = await api('/materias/1/topicos');
    todosTopicos = t.aulas.flatMap(a => a.topicos.map(x => ({ ...x, aula: a.titulo })));
  }
  return todosTopicos;
}

async function telaRevisar(el) {
  const [fila, topicos] = await Promise.all([api('/revisar'), listaTopicos()]);
  let pos = 0, feitas = 0;

  const desenhar = () => {
    if (pos >= fila.itens.length) {
      el.innerHTML = `<div class="cabeca"><div><h1>Revisar classificação</h1></div></div>
        <section class="painel vazio"><h2>Fila de exemplo concluída</h2><p>Você revisou ${feitas} questões. Na versão real, a próxima leva aparece aqui.</p>
        <a class="btn btn--sec" href="#filtrar">Montar caderno</a></section>`;
      return;
    }
    const q = fila.itens[pos];
    let escolhido = q.sugestoes[0].codigo;
    el.innerHTML = `
      <div class="cabeca"><div><h1>Revisar classificação</h1><p>Confira o tópico das questões em que o sistema ficou em dúvida. Sua escolha vale sobre a sugestão.</p></div>
        <div class="progresso"><span class="num">${fmt(fila.total - feitas)}</span> para revisar</div></div>
      <div class="revisao">
        <section class="painel questao">
          <div class="questao__meta"><span>Código <b>${esc(q.codigo)}</b></span><span><b>${esc(q.banca)}</b></span><span>${esc(q.orgao)}</span><span>${q.ano}</span></div>
          <p class="questao__enun">${esc(q.enunciado)}</p>
          ${q.tipo === 'certo_errado'
            ? `<p class="gabarito">Certo ou errado · gabarito: <b>${q.gabarito === 'C' ? 'Certo' : 'Errado'}</b></p>`
            : `<ul class="alts">${q.alternativas.map((a, i) => `<li class="${'ABCDE'[i] === q.gabarito ? 'gab' : ''}"><b>${'ABCDE'[i]}</b>${esc(a)}</li>`).join('')}</ul>`}
          ${q.tem_imagem ? '<div class="aviso-img">Esta questão tem imagem ou tabela no original. Confira no PDF se precisar.</div>' : ''}
        </section>
        <aside class="painel decisao">
          <h2>Qual é o tópico?</h2>
          <p>Sugestões do sistema, da mais provável para a menos.</p>
          <div class="opcoes">${q.sugestoes.map((s, i) => `
            <button type="button" class="opcao" data-cod="${esc(s.codigo)}" aria-pressed="${i === 0}">
              <kbd>${i + 1}</kbd>
              <span><strong>${esc(s.codigo)} ${esc(s.titulo)}</strong>
                <span class="confianca"><span class="barra"><i style="width:${Math.round(s.confianca * 100)}%"></i></span><small>${Math.round(s.confianca * 100)}%</small></span></span>
            </button>`).join('')}</div>
          <div class="campo outro"><label for="outro">Nenhum desses? Escolha outro tópico</label>
            <select id="outro"><option value="">Selecionar tópico</option>
              ${topicos.map(t => `<option value="${esc(t.codigo)}">${esc(t.codigo)} ${esc(t.titulo)}</option>`).join('')}
            </select></div>
          <div class="decisao__acoes">
            <button class="btn btn--sec" type="button" id="pular">Pular</button>
            <button class="btn btn--pri" type="button" id="confirmar">Confirmar tópico</button>
          </div>
          <p class="atalhos">Atalhos: <b>1</b>/<b>2</b> escolhem, <b>Enter</b> confirma, <b>P</b> pula.</p>
        </aside>
      </div>`;

    const marcar = (cod) => {
      escolhido = cod;
      $$('.opcao').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cod === cod)));
      if ($$('.opcao').some(b => b.dataset.cod === cod)) $('#outro').value = '';
    };
    $$('.opcao').forEach(b => b.addEventListener('click', () => marcar(b.dataset.cod)));
    $('#outro').addEventListener('change', e => { if (e.target.value) marcar(e.target.value); });
    $('#confirmar').addEventListener('click', async () => {
      await api(`/revisar/${q.id}`, { topicos: [escolhido] });
      feitas++; pos++;
      $('#menu-revisar').textContent = fmt(fila.total - feitas);
      avisar(`Tópico ${escolhido} confirmado`);
      desenhar();
    });
    $('#pular').addEventListener('click', () => { pos++; desenhar(); });
  };

  teclas = (e) => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === '1' || e.key === '2') { const b = $$('.opcao')[Number(e.key) - 1]; if (b) b.click(); }
    else if (e.key === 'Enter' && $('#confirmar')) { e.preventDefault(); $('#confirmar').click(); }
    else if ((e.key === 'p' || e.key === 'P') && $('#pular')) $('#pular').click();
  };
  desenhar();
}

/* ───────── Montar caderno ───────── */
async function telaFiltrar(el) {
  const r = resumoCache || await carregarResumo();
  const comDados = r.materias.filter(m => m.questoes > 0);
  const { bancas } = await api('/bancas');
  let materia = comDados[0]?.id;
  const sel = new Set(), bancasSel = new Set();
  let codigos = [];

  el.innerHTML = `
    <div class="cabeca"><div><h1>Montar caderno</h1><p>Marque os tópicos da aula e copie os códigos para colar no Tec.</p></div>
      <div class="campo" style="min-width:240px"><label for="f-materia">Matéria</label>
        <select id="f-materia">${comDados.map(m => `<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select></div></div>
    <div class="filtro">
      <section class="painel">
        <div class="painel__cab"><h2>Tópicos</h2><button class="btn btn--leve" type="button" id="limpar">Limpar seleção</button></div>
        <div class="arvore" id="arvore"></div>
      </section>
      <section class="painel">
        <div class="filtros-extra">
          <div class="campo"><span>Bancas</span><div class="fichas" id="bancas">${bancas.map(b => `<button type="button" class="ficha" data-b="${esc(b)}" aria-pressed="false">${esc(b)}</button>`).join('')}</div>
            <small>Sem nenhuma marcada, vale todas.</small></div>
          <div class="campo"><span>Ano da prova</span><div class="anos">
            <input type="number" id="ano-min" placeholder="De" min="1990" max="2030" aria-label="Ano inicial">
            <span>até</span>
            <input type="number" id="ano-max" placeholder="Até" min="1990" max="2030" aria-label="Ano final"></div></div>
          <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="so-rev"> Só questões com tópico confirmado pela equipe</label>
        </div>
        <div class="saida">
          <div class="saida__total"><span class="num" id="total">0</span><span>questões selecionadas</span></div>
          <div class="codigos" id="codigos" aria-live="polite"></div>
          <div class="saida__acoes">
            <button class="btn btn--pri" type="button" id="copiar" disabled>Copiar códigos</button>
            <div class="linha">
              <button class="btn btn--sec" type="button" disabled title="Disponível na etapa de comentários">Baixar em Word</button>
              <button class="btn btn--sec" type="button" disabled title="Disponível na etapa de comentários">Baixar em PDF</button>
              <button class="btn btn--sec" type="button" disabled title="Disponível na etapa de comentários">Formato da máquina virtual</button>
            </div>
            <small>Os downloads com comentários ficam disponíveis na etapa 3.</small>
          </div>
        </div>
      </section>
    </div>`;

  const arvore = $('#arvore');
  const desenharArvore = async () => {
    const t = await api(`/materias/${materia}/topicos`);
    if (!t.aulas.length) { arvore.innerHTML = '<div class="vazio">Esta matéria ainda não tem matriz de tópicos.</div>'; return; }
    arvore.innerHTML = t.aulas.map(a => `
      <div class="aula">
        <label><input type="checkbox" data-aula="${esc(a.codigo)}"> ${esc(a.titulo)}</label>
        <ul>${a.topicos.map(x => `<li><label>
          <input type="checkbox" data-top="${esc(x.codigo)}" data-de="${esc(a.codigo)}" ${sel.has(x.codigo) ? 'checked' : ''}>
          <span class="cod num">${esc(x.codigo)}</span><span>${esc(x.titulo)}</span><span class="qtd num">${fmt(x.questoes)}</span>
        </label></li>`).join('')}</ul>
      </div>`).join('');
    sincronizarAulas();
  };
  const sincronizarAulas = () => {
    $$('[data-aula]', arvore).forEach(cb => {
      const filhos = $$(`[data-de="${cb.dataset.aula}"]`, arvore);
      const n = filhos.filter(f => f.checked).length;
      cb.checked = n === filhos.length && n > 0;
      cb.indeterminate = n > 0 && n < filhos.length;
    });
  };
  let pendente;
  const atualizar = () => {
    clearTimeout(pendente);
    pendente = setTimeout(async () => {
      if (!sel.size) { codigos = []; mostrar(); return; }
      const res = await api('/filtrar', {
        materia_id: Number(materia), topicos: [...sel], bancas: [...bancasSel],
        ano_min: Number($('#ano-min').value) || null, ano_max: Number($('#ano-max').value) || null,
        so_revisadas: $('#so-rev').checked,
      });
      codigos = res.codigos; mostrar();
    }, 180);
  };
  const mostrar = () => {
    $('#total').textContent = fmt(codigos.length);
    $('#codigos').textContent = codigos.join(', ');
    $('#copiar').disabled = !codigos.length;
  };

  arvore.addEventListener('change', e => {
    const cb = e.target;
    if (cb.dataset.aula) {
      $$(`[data-de="${cb.dataset.aula}"]`, arvore).forEach(f => { f.checked = cb.checked; f.checked ? sel.add(f.dataset.top) : sel.delete(f.dataset.top); });
    } else if (cb.dataset.top) {
      cb.checked ? sel.add(cb.dataset.top) : sel.delete(cb.dataset.top);
    }
    sincronizarAulas(); atualizar();
  });
  $('#bancas').addEventListener('click', e => {
    const b = e.target.closest('.ficha'); if (!b) return;
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    on ? bancasSel.add(b.dataset.b) : bancasSel.delete(b.dataset.b);
    atualizar();
  });
  ['#ano-min', '#ano-max', '#so-rev'].forEach(s => $(s).addEventListener('change', atualizar));
  $('#limpar').addEventListener('click', () => { sel.clear(); $$('input[type=checkbox]', arvore).forEach(c => { c.checked = false; c.indeterminate = false; }); atualizar(); });
  $('#f-materia').addEventListener('change', e => { materia = e.target.value; sel.clear(); desenharArvore(); atualizar(); });
  $('#copiar').addEventListener('click', async () => {
    const texto = codigos.join(', ');
    try { await navigator.clipboard.writeText(texto); }
    catch { const ta = document.createElement('textarea'); ta.value = texto; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    avisar(`${fmt(codigos.length)} códigos copiados`);
  });

  if (materia) await desenharArvore();
  else arvore.innerHTML = '<div class="vazio">Nenhuma matéria com questões ainda. Envie um caderno primeiro.</div>';
}

/* ───────── Rotas ───────── */
let teclas = null;
document.addEventListener('keydown', e => teclas && teclas(e));
const TELAS = { painel: telaPainel, enviar: telaEnviar, revisar: telaRevisar, filtrar: telaFiltrar };

async function navegar() {
  const [rota, qs] = (location.hash.slice(1) || 'painel').split('?');
  const tela = TELAS[rota] ? rota : 'painel';
  teclas = null;
  $$('.menu a').forEach(a => a.dataset.rota === tela ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const el = $('#conteudo');
  el.innerHTML = '<p class="vazio">Carregando…</p>';
  try { await TELAS[tela](el, new URLSearchParams(qs || '')); }
  catch (err) { el.innerHTML = `<section class="painel vazio"><h2>Não foi possível carregar esta tela</h2><p>${esc(err.message)}. Recarregue a página; se continuar, verifique o serviço em /health.</p></section>`; }
  el.focus({ preventScroll: true });
}

(async () => {
  try {
    const eu = await fetch('/api/eu').then(r => r.json());
    $('#usuario').textContent = eu.usuario;
  } catch { $('#usuario').textContent = '—'; }
  await carregarResumo().catch(() => {});
  window.addEventListener('hashchange', navegar);
  navegar();
})();
</script>
</body>
